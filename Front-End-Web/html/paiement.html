<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Paiement</title>
  <link rel="stylesheet" href="/Front-End-Web/css/normalize.css">
  <link rel="stylesheet" href="/Front-End-Web/css/paiement.css">
</head>
<body>
  <div class="conteneur">
    <header class="header">
      <div class="logo">
        <a href="accueil.html">
          <img
            id="img-logo"
            src="/Front-End-Web/ressources/logo.png"
            alt="Logo BiblioSmart"
            width="240"
            height="80"
          />
        </a>
      </div>
      <nav id="navigation">
        <!-- SetUpNavigation() injectera ici les liens (Accueil, Connexion, Historique…) -->
      </nav>
    </header>

    <main class="main">
      <div class="containerPaiement">
        <h1>Paiement du solde</h1>
        <form id="paymentForm">
          <label for="nom">Nom sur la carte</label>
          <input type="text" id="nom" name="nom" required />

          <label for="numero">Numéro de carte</label>
          <input
            type="text"
            id="numero"
            name="numero"
            pattern="^4519\d{12}$"
            title="Doit commencer par 4519 et contenir 16 chiffres"
            maxlength="16"
            required
          />

          <label for="date_expiration">Date d’expiration (MM/AA)</label>
          <input
            type="text"
            id="date_expiration"
            name="date_expiration"
            placeholder="MM/AA"
            pattern="^(0[1-9]|1[0-2])\/(2[5-9])$"
            title="Format MM/AA, année ≥ 2025"
            required
          />

          <label for="cvc">CVC</label>
          <input
            type="password"
            id="cvc"
            name="cvc"
            maxlength="3"
            pattern="\d{3}"
            title="3 chiffres"
            required
          />

          <label for="montant">Montant à payer ($ CAD)</label>
          <input
            type="number"
            id="montant"
            name="montant"
            step="0.01"
          />

          <p id="messageErreur" class="message_erreur"></p>
          <p id="messageConfirmation" class="message_confirmation" style="display:none;"></p>

          <button type="submit" class="btn-payer">
            <img
              src="/Front-End-Web/ressources/pay-icon.png"
              alt="Icône Payer"
              class="icone-btn"
            />
            PAYER
          </button>
        </form>
      </div>
    </main>

    <footer class="debutfooter">
      <div class="footer">
        <!-- ... ton contenu de footer ... -->
      </div>
      <p class="copyright">&copy; 2025 BiblioSmart, tous droits réservés</p>
    </footer>
  </div>

  <!-- Scripts : Paiement.js d’abord, puis mainScript.js -->
  <script src="/Front-End-Web/Scripts/Paiement.js"></script>
  <script src="/Front-End-Web/js/mainScript.js"></script>
</body>
</html>
